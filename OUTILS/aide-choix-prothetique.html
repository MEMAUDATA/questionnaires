Pour tous les autres, des intra-auriculaires sont plus adaptés. La réduction active contre le bruit permet de réduire le niveau sonore d'écoute et prévient des effets nocifs contre le bruit à condition d'avoir une bonne étanchéité des conduits.

Le sur-mesure est possible avec Earow et est compatible multi-marque d'écouteurs mais peut affecter l'ANC.`,
        suite: "fin",
      },
      casque: {
        titre: "Casque",
        texte: `Pour un usage intérieur sans trop de bruits, privilégier les casques ouverts qui ont de meilleures HF.

A l'extérieur ou à l'intérieur si présence de bruit, privilégier les casques fermés avec réduction active du bruit.
Il existe des casques circum-aural ou supra-aural, choisir la taille permettant d'acheminer correctement le son vers le conduit auditif car un mauvais placement affectera la qualité sonore.`,
        suite: "fin",
      },
      ecoute_de_la_tv: {
        titre: "Ecoute de la TV",
        texte: `Sennheiser propose un casque pour malentendant que tout le monde connaît et de très bonne qualité mais il propose aussi un boîtier permettant d'y connecter un casque ou des écouteurs sans fil.

Sinon, il vaut mieux un boîtier reliant les appareils à la source audio pour l'écoute de la TV mais pas forcément pour l'écoute musicale (bande passante des aides auditives limitée).

Un boîtier Auracast permet aussi de diffuser le son sans limite de marque d'appareils auditifs et d'écouteurs/casques à condition qu'ils soient compatibles Bluetooth LE Audio.`,
        suite: "fin",
      },
    };

    /* ============================================================
       MOTEUR : affiche l'étape courante et suit le dictionnaire
       ============================================================ */
    var DEBUT = "debut", FIN = "fin", MAX_ETAPES = 200;
    var vue = document.getElementById("acp-view");
    var parcours = [];   /* étapes parcourues : [{etape: "nom", reponse: "libellé choisi"}] */

    function echapper(t){
      return String(t).replace(/[&<>"']/g, function(c){
        return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
      });
    }
    /* Transforme les adresses http(s) en liens, après échappement du texte */
    function avecLiens(t){
      return echapper(t).replace(/https?:\/\/[^\s<]+[^\s<.,;:!?)]/g, function(u){
        return '<a href="'+u+'" target="_blank" rel="noopener noreferrer">'+u+'</a>';
      });
    }
    /* Une ligne vide dans le texte = un nouveau paragraphe */
    function texteHtml(t){
      if(!t) return "";
      return t.split(/\n{2,}/).map(function(p){ return '<p>'+avecLiens(p)+'</p>'; }).join("");
    }
    function imageHtml(fichier){
      return '<figure class="Aide_figure"><img src="'+echapper(racinePlugin()+IMAGES_SOUS_DOSSIER+fichier)+'" alt="Schéma de référence" '+
        'onerror="this.outerHTML=\'<p class=&quot;Error_message_not_all_answered&quot;>Schéma indisponible.</p>\'"></figure>';
    }

    /* Nom de l'étape qui suit, selon la réponse donnée */
    function suivante(nom, reponse){
      var e = ETAPES[nom];
      return e.question ? e.reponses[reponse] : e.suite;
    }

    function afficher(){
      var p = parcours[parcours.length-1], e = ETAPES[p.etape], h = "";
      h += '<p class="Aide_step">Étape '+parcours.length+'</p>';
      if(e.titre || e.texte){
        h += '<div class="Aide_card">'+(e.titre ? '<h3>'+echapper(e.titre)+'</h3>' : '')+texteHtml(e.texte)+'</div>';
      }
      if(e.image && !e.question) h += imageHtml(e.image);
      if(e.question){
        h += '<fieldset class="Aide_question"><legend>'+echapper(e.question)+' *</legend>';
        if(e.image) h += imageHtml(e.image);
        Object.keys(e.reponses).forEach(function(libelle){
          /* un <div> par réponse : une réponse par ligne, même sans CSS */
          h += '<div><label><input type="radio" name="reponse" value="'+echapper(libelle)+'"'+(p.reponse===libelle ? ' checked' : '')+'>'+echapper(libelle)+'</label></div>';
        });
        h += '<p class="Error_message_not_all_answered" hidden>Cette question est obligatoire.</p></fieldset>';
      }
      h += '<div class="buttons-container">'+
           (parcours.length < 2 ? '' : '<button type="button" id="acp-prev">Précédent</button>')+
           '<button type="button" id="acp-next">'+(suivante(p.etape, p.reponse) === FIN ? 'Terminer' : 'Suivant')+'</button></div>';
      vue.innerHTML = h;
      if(parcours.length > 1) document.getElementById("acp-prev").onclick = precedent;
      document.getElementById("acp-next").onclick = suivant;
      vue.scrollIntoView({behavior:"smooth", block:"start"});
    }

    /* Réponse choisie : on la mémorise et on adapte le libellé du bouton */
    vue.addEventListener("change", function(ev){
      if(!ev.target || ev.target.type !== "radio") return;
      var p = parcours[parcours.length-1];
      p.reponse = ev.target.value;
      var fs = ev.target.closest("fieldset");
      fs.classList.remove("Aide_invalid");
      fs.querySelector(".Error_message_not_all_answered").hidden = true;
      document.getElementById("acp-next").textContent = (suivante(p.etape, p.reponse) === FIN ? "Terminer" : "Suivant");
    });

    function suivant(){
      var p = parcours[parcours.length-1], e = ETAPES[p.etape];
      if(e.question && !p.reponse){   /* toutes les questions sont obligatoires */
        var fs = vue.querySelector("fieldset");
        fs.classList.add("Aide_invalid");
        fs.querySelector(".Error_message_not_all_answered").hidden = false;
        return;
      }
      var n = suivante(p.etape, p.reponse);
      if(n === FIN || parcours.length >= MAX_ETAPES) return synthese();
      if(!ETAPES[n]){ console.error("Étape inconnue : "+n); return synthese(); }
      parcours.push({etape: n, reponse: null});
      afficher();
    }
    function precedent(){
      if(parcours.length < 2) return;
      parcours.pop();
      afficher();
    }

    function enregistrerPdf(){
      var zone = document.getElementById("acp-summary");
      if(typeof window.html2pdf !== "function"){ window.print(); return; }
      /* Copie dédiée au PDF : titre + synthèse, sur fond blanc, sans cadre ni marge. */
      var copie = zone.cloneNode(true);
      copie.removeAttribute("id");
      copie.style.cssText = "background:#fff;border:0;box-shadow:none;margin:0;padding:0;max-width:none;width:100%;";
      var entete = document.createElement("div");
      entete.innerHTML = '<h2 style="text-align:left;margin:0 0 4px">Aide au choix prothétique</h2>'+
        '<p style="text-align:left;margin:0 0 12px;color:#555">'+new Date().toLocaleDateString("fr-FR")+'</p>';
      var page = document.createElement("div");
      page.appendChild(entete); page.appendChild(copie);
      window.scrollTo(0, 0);   /* html2canvas décale la capture si la page est défilée */
      window.html2pdf().set({
        margin: [12, 12, 12, 12], filename: "aide-choix-prothetique.pdf",
        image: {type:"jpeg", quality:0.98},
        html2canvas: {scale:2, useCORS:true, scrollX:0, scrollY:0},
        jsPDF: {unit:"mm", format:"a4", orientation:"portrait"},
        pagebreak: {mode:["css","legacy"], avoid:["section","h4","p.Aide_answer"]}
      }).from(page).save();
    }

    /* Page finale : rappel des étapes parcourues, avec les réponses données */
    function synthese(){
      var h = '<div class="Aide_card Aide_summary" id="acp-summary"><h3>Synthèse du parcours</h3>';
      parcours.forEach(function(p){
        var e = ETAPES[p.etape];
        if(!e.titre && !e.texte && !p.reponse) return;
        h += '<section>'+(e.titre ? '<h4>'+echapper(e.titre)+'</h4>' : '');
        if(p.reponse) h += '<p class="Aide_answer">'+echapper(e.question.replace(/\s+/g, " "))+' <strong>'+echapper(p.reponse)+'</strong></p>';
        h += texteHtml(e.texte)+'</section>';
      });
      h += '</div><div class="buttons-container">'+
           '<button type="button" id="acp-print">'+(typeof window.html2pdf === "function" ? 'Enregistrer en PDF' : 'Imprimer')+'</button>'+
           '<button type="button" id="acp-back">Retour</button>'+
           '<button type="button" id="acp-reset">Recommencer</button></div>';
      vue.innerHTML = h;
      document.getElementById("acp-print").onclick = enregistrerPdf;
      document.getElementById("acp-back").onclick = afficher;
      document.getElementById("acp-reset").onclick = demarrer;
      vue.scrollIntoView({behavior:"smooth", block:"start"});
    }

    function demarrer(){
      parcours = [{etape: DEBUT, reponse: null}];
      afficher();
    }
    demarrer();
    })();
    </script>
</body>
</html>
