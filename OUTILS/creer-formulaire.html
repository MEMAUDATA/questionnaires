<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Créateur de formulaires</title>
<style>
  :root { --ink:#1d2433; --muted:#6b7385; --line:#d9dde6; --accent:#1f5fbf; --bg:#f3f4f7; --danger:#c0392b; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }

  /* Barre d'outils */
  .toolbar { position:sticky; top:0; z-index:10; display:flex; flex-wrap:wrap; gap:6px; align-items:center; padding:8px 12px; background:#fff; border-bottom:1px solid var(--line); }
  .toolbar button, .tab { font:inherit; font-size:14px; padding:6px 10px; border:1px solid var(--line); background:#fff; border-radius:6px; cursor:pointer; }
  .toolbar button:hover { background:#eef2fa; border-color:var(--accent); }
  .toolbar .primary { background:var(--accent); color:#fff; border-color:var(--accent); }
  .toolbar .primary:hover { background:#184d9a; }
  .brand { font-weight:600; margin-right:6px; }
  .tabs { display:inline-flex; margin-right:8px; }
  .tab { border-radius:0; }
  .tab:first-child { border-radius:6px 0 0 6px; } .tab:last-child { border-radius:0 6px 6px 0; border-left:none; }
  .tab.active { background:var(--ink); color:#fff; border-color:var(--ink); }
  .sep { width:1px; height:22px; background:var(--line); margin:0 4px; }
  .sp { flex:1; }

  .mode-edit .only-fill, .mode-fill .only-edit { display:none !important; }
  .mode-edit #fillView, .mode-fill #editView { display:none; }

  .page { max-width:820px; margin:18px auto 60px; padding:0 12px; }

  /* Mode création */
  .card { background:#fff; border:1px solid var(--line); border-radius:8px; padding:12px 14px; margin-bottom:10px; }
  .card.q { margin-left:18px; border-left:3px solid var(--accent); }
  .row { display:flex; gap:6px; align-items:center; margin-bottom:8px; }
  .lbl { display:block; font-size:12px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); margin:6px 0 2px; }
  #editView input[type=text], #editView input[type=number], #editView textarea, #editView select {
    width:100%; font:inherit; padding:6px 8px; border:1px solid var(--line); border-radius:6px; background:#fff; }
  #editView select { width:auto; }
  #editView textarea { resize:vertical; }
  #editView input:focus, #editView textarea:focus, #editView select:focus { outline:2px solid rgba(31,95,191,.3); border-color:var(--accent); }
  .stitle { font-size:17px !important; font-weight:600; }
  .grid { display:grid; grid-template-columns:repeat(3,1fr); gap:6px 10px; margin-top:6px; }
  .grid.two { grid-template-columns:1fr 1fr; }
  .chk { display:inline-flex; gap:6px; align-items:center; margin-top:8px; font-size:14px; color:var(--muted); cursor:pointer; }
  .mini { font:inherit; font-size:13px; padding:3px 8px; border:1px solid var(--line); background:#fff; border-radius:5px; cursor:pointer; }
  .mini:hover { background:#eef2fa; border-color:var(--accent); }
  .mini.danger:hover { background:#fdeaea; border-color:var(--danger); color:var(--danger); }
  .adds { display:flex; flex-wrap:wrap; gap:6px; margin:0 0 18px 18px; }
  .help { color:var(--muted); font-size:13px; margin:0 0 12px; }

  /* Mode passation */
  #fillView { background:#fff; padding:18mm; box-shadow:0 2px 14px rgba(0,0,0,.12); min-height:260mm; font-family:Georgia, "Times New Roman", serif; }
  #fillView h1 { font-size:25px; margin:0 0 6px; line-height:1.25; }
  #fillView h2 { font-size:18px; color:var(--accent); margin:22px 0 8px; padding-bottom:3px; border-bottom:1px solid var(--line); }
  .desc { color:var(--muted); margin:0 0 12px; white-space:pre-wrap; }
  .pat { display:grid; grid-template-columns:1.2fr 1fr 1fr; gap:8px 16px; padding:10px 0 14px; margin-bottom:6px; border-bottom:2px solid var(--ink); font-family:system-ui, sans-serif; font-size:14px; }
  .pat label { display:block; font-size:12px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); }
  .pat .hint { grid-column:1/-1; font-size:12px; color:var(--muted); margin:0; }
  #fillView input[type=text], #fillView input[type=number], #fillView input[type=date], #fillView textarea, #fillView select {
    width:100%; font:inherit; font-family:system-ui, sans-serif; padding:6px 8px; border:1px solid var(--line); border-radius:5px; background:#f9fafc; }
  #fillView textarea { resize:none; overflow:hidden; min-height:3.2em; }
  #fillView select { width:auto; min-width:14em; }
  .fq { margin:0 0 16px; break-inside:avoid; font-family:system-ui, sans-serif; }
  .ql { font-weight:600; margin-bottom:5px; font-family:Georgia, "Times New Roman", serif; font-size:16px; }
  .ql .req { color:var(--danger); margin-left:3px; }
  .ql .none { color:var(--muted); font-style:italic; font-weight:normal; }
  .opt { display:flex; gap:8px; align-items:center; padding:2px 0; cursor:pointer; }
  .opt input { width:16px; height:16px; margin:0; accent-color:var(--accent); }
  .rng { display:flex; gap:10px; align-items:center; }
  /* Curseur : piste explicitement dessinée (visible aussi à l'impression / en PDF) */
  .rng input[type=range] { flex:1; min-width:0; height:24px; margin:0; background:transparent; cursor:pointer;
    -webkit-appearance:none; appearance:none; -webkit-print-color-adjust:exact; print-color-adjust:exact; }
  .rng input[type=range]:focus { outline:none; }
  .rng input[type=range]::-webkit-slider-runnable-track { height:8px; border-radius:5px; background:#dbe3f1; border:1px solid #8f9ab0; }
  .rng input[type=range]::-moz-range-track { height:8px; border-radius:5px; background:#dbe3f1; border:1px solid #8f9ab0; box-sizing:border-box; }
  .rng input[type=range]::-moz-range-progress { height:8px; border-radius:5px; background:var(--accent); }
  .rng input[type=range]::-webkit-slider-thumb { -webkit-appearance:none; appearance:none; width:20px; height:20px; margin-top:-7px;
    border-radius:50%; background:var(--accent); border:2px solid #fff; box-shadow:0 0 0 1px var(--accent); }
  .rng input[type=range]::-moz-range-thumb { width:16px; height:16px; border-radius:50%; background:var(--accent); border:2px solid #fff; box-shadow:0 0 0 1px var(--accent); }
  .rng input[type=range]:focus-visible::-webkit-slider-thumb { box-shadow:0 0 0 1px var(--accent), 0 0 0 4px rgba(31,95,191,.3); }
  .rng .e { color:var(--muted); font-size:13px; min-width:3em; }
  .rng .e:last-of-type { text-align:right; }
  .rng output { min-width:2.5em; text-align:center; font-weight:700; color:var(--accent); }
  .rng.untouched input[type=range]::-webkit-slider-thumb { background:#b5bbc9; box-shadow:0 0 0 1px #8f9ab0; }
  .rng.untouched input[type=range]::-moz-range-thumb { background:#b5bbc9; box-shadow:0 0 0 1px #8f9ab0; }
  .rng.untouched input[type=range]::-moz-range-progress { background:transparent; }
  .rng.untouched output { color:var(--muted); font-weight:normal; }
  .clr { margin-top:3px; font-size:12px; color:var(--muted); background:none; border:none; padding:0; cursor:pointer; text-decoration:underline; }

  @page { size:A4; margin:16mm; }
  @media print {
    body { background:#fff; }
    .toolbar, #editView, .clr, .pat .hint { display:none !important; }
    #fillView { display:block !important; box-shadow:none; padding:0; min-height:0; }
    #fillView input[type=text], #fillView input[type=number], #fillView input[type=date], #fillView textarea, #fillView select { background:#fff; }
    .page { max-width:none; margin:0; padding:0; }
    h2 { break-after:avoid; }
  }
</style>
</head>
<body class="mode-edit">

<div class="toolbar">
  <span class="brand">Formulaires</span>
  <span class="tabs">
    <button class="tab active" id="tabEdit">Création</button><button class="tab" id="tabFill">Passation</button>
  </span>
  <button id="btnLoad" title="Charger un modèle (.json), une passation (.json) ou un fichier .html">Charger…</button>

  <span class="only-edit sep"></span>
  <button class="only-edit" id="btnSaveTpl">Enregistrer le modèle (.json)</button>
  <button class="only-edit" id="btnSaveHtml" title="Un fichier HTML prêt à l'emploi, avec ce modèle intégré">Formulaire HTML autonome</button>
  <button class="only-edit" id="btnNew">Nouveau</button>

  <span class="only-fill sep"></span>
  <button class="only-fill" id="btnSavePass">Enregistrer la passation</button>
  <button class="only-fill" id="btnCsv">Exporter en CSV</button>
  <button class="only-fill" id="btnMerge" title="Sélectionner plusieurs passations .json pour produire un seul CSV">Fusionner en CSV…</button>
  <button class="only-fill" id="btnReset">Effacer les réponses</button>
  <span class="sp"></span>
  <button class="only-fill primary" id="btnPdf">Télécharger en PDF</button>

  <input type="file" id="fileLoad" accept=".json,.html,.htm" hidden>
  <input type="file" id="fileMerge" accept=".json" multiple hidden>
</div>

<div class="page">
  <div id="editView"></div>
  <div id="fillView"></div>
</div>

<script type="application/json" id="embedded"></script>
<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var FORMAT = 'hds-formulaire';
  var TYPES = {
    short: 'Texte court', long: 'Paragraphe', number: 'Nombre', date: 'Date',
    radio: 'Choix unique (boutons radio)', checkbox: 'Choix multiples (cases)',
    select: 'Liste déroulante', range: 'Curseur'
  };
  var HAS_OPTS = { radio: 1, checkbox: 1, select: 1 };

  var tpl, ans = {}, patient = {}, mode = 'edit', dirty = false;

  /* ---------- Utilitaires ---------- */
  function pad(n) { return n < 10 ? '0' + n : '' + n; }
  function today() { var d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function uid() { return 'q' + Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-3); }
  function txt(n) { return n ? n.textContent.trim() : ''; }
  function num(v, d) { v = parseFloat(v); return isFinite(v) ? v : d; }
  function slug(s) {
    return String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '')
      .replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'formulaire';
  }
  function h(tag, a, kids) {
    var e = document.createElement(tag);
    Object.keys(a || {}).forEach(function (k) {
      var v = a[k];
      if (k === 'class') e.className = v;
      else if (k === 'value' || k === 'checked' || k === 'selected') e[k] = v;
      else if (v !== false && v != null) e.setAttribute(k, v === true ? '' : v);
    });
    (kids || []).forEach(function (c) { e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); });
    return e;
  }
  function download(name, text, mime) {
    var a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([text], { type: mime + ';charset=utf-8' }));
    a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
  }
  function autosize(t) { t.style.height = 'auto'; t.style.height = (t.scrollHeight + 2) + 'px'; }
  function autosizeAll() { document.querySelectorAll('#fillView textarea').forEach(autosize); }
  function isEmpty(v) { return v === undefined || v === '' || (Array.isArray(v) && !v.length); }

  /* ---------- Modèle ---------- */
  function newQuestion(type) {
    return { id: uid(), type: type || 'short', label: '', required: false,
      options: HAS_OPTS[type] ? ['Option 1', 'Option 2'] : [], min: 0, max: 10, step: 1, minLabel: '', maxLabel: '' };
  }
  function newSection(title) { return { title: title || '', questions: [newQuestion('short')] }; }
  function blankTemplate() { return { title: 'Nouveau questionnaire', description: '', sections: [newSection('Section 1')] }; }

  function normalize(t) {
    if (!t || typeof t !== 'object' || !Array.isArray(t.sections)) throw new Error('modèle invalide');
    var seen = {};
    var out = { title: String(t.title || 'Questionnaire'), description: String(t.description || ''), sections: [] };
    t.sections.forEach(function (s) {
      var ns = { title: String((s && s.title) || ''), questions: [] };
      ((s && s.questions) || []).forEach(function (q) {
        q = q || {};
        var id = String(q.id || ''); if (!id || seen[id]) id = uid(); seen[id] = 1;
        ns.questions.push({
          id: id, type: TYPES[q.type] ? q.type : 'short', label: String(q.label || ''), required: !!q.required,
          options: Array.isArray(q.options) ? q.options.map(String) : [],
          min: num(q.min, 0), max: num(q.max, 10), step: num(q.step, 1) > 0 ? num(q.step, 1) : 1,
          minLabel: String(q.minLabel || ''), maxLabel: String(q.maxLabel || '')
        });
      });
      out.sections.push(ns);
    });
    if (!out.sections.length) out.sections.push(newSection('Section 1'));
    return out;
  }

  /* Ancien format de la page « interview.html » → modèle */
  function fromLegacy(d) {
    var t = { title: txt(d.querySelector('h1')) || (d.title || 'Questionnaire importé'), description: '', sections: [] };
    d.querySelectorAll('.sec').forEach(function (sec) {
      var s = { title: txt(sec.querySelector('h2')), questions: [] };
      sec.querySelectorAll('.qa').forEach(function (qa) {
        var q = newQuestion('long'); q.label = txt(qa.querySelector('.q'));
        var w = qa.querySelector('.opts');
        if (w && w.getAttribute('data-type') === 'radio') {
          q.type = 'radio';
          q.options = [].map.call(w.querySelectorAll('.ot'), txt).filter(Boolean);
        } else if (w && w.getAttribute('data-type') === 'range') {
          var r = w.querySelector('input[type=range]');
          q.type = 'range';
          if (r) { q.min = num(r.getAttribute('min'), 0); q.max = num(r.getAttribute('max'), 10); q.step = num(r.getAttribute('step'), 1); }
          q.minLabel = txt(w.querySelector('.rmin')); q.maxLabel = txt(w.querySelector('.rmax'));
        }
        s.questions.push(q);
      });
      if (!s.questions.length) s.questions.push(newQuestion('short'));
      t.sections.push(s);
    });
    return normalize(t);
  }

  /* ---------- Mode création ---------- */
  function btn(label, act, title, danger) {
    return h('button', { type: 'button', 'class': 'mini' + (danger ? ' danger' : ''), 'data-act': act, title: title || '' }, [label]);
  }
  function field(label, attrs) {
    return h('div', {}, [h('span', { 'class': 'lbl' }, [label]), h('input', attrs)]);
  }
  function qCard(q, si, qi) {
    var c = h('div', { 'class': 'card q', 'data-s': si, 'data-q': qi });
    var sel = h('select', { 'data-f': 'type' });
    Object.keys(TYPES).forEach(function (k) { sel.appendChild(h('option', { value: k, selected: k === q.type }, [TYPES[k]])); });
    c.appendChild(h('div', { 'class': 'row' }, [sel, h('span', { 'class': 'sp' }),
      btn('↑', 'qup', 'Monter'), btn('↓', 'qdown', 'Descendre'), btn('⧉', 'qdup', 'Dupliquer'), btn('✕', 'qdel', 'Supprimer', true)]));
    c.appendChild(h('input', { type: 'text', 'data-f': 'label', placeholder: 'Intitulé de la question', value: q.label }));
    if (HAS_OPTS[q.type]) {
      c.appendChild(h('span', { 'class': 'lbl' }, ['Options (une par ligne)']));
      c.appendChild(h('textarea', { 'data-f': 'options', rows: Math.max(3, q.options.length + 1), value: q.options.join('\n') }));
    }
    if (q.type === 'range') {
      c.appendChild(h('div', { 'class': 'grid' }, [
        field('Minimum', { type: 'number', step: 'any', 'data-f': 'min', value: q.min }),
        field('Maximum', { type: 'number', step: 'any', 'data-f': 'max', value: q.max }),
        field('Pas', { type: 'number', step: 'any', min: '0', 'data-f': 'step', value: q.step })
      ]));
      c.appendChild(h('div', { 'class': 'grid two' }, [
        field('Libellé du minimum', { type: 'text', 'data-f': 'minLabel', value: q.minLabel, placeholder: 'ex. Aucune gêne' }),
        field('Libellé du maximum', { type: 'text', 'data-f': 'maxLabel', value: q.maxLabel, placeholder: 'ex. Gêne maximale' })
      ]));
    }
    c.appendChild(h('label', { 'class': 'chk' }, [h('input', { type: 'checkbox', 'data-f': 'required', checked: q.required }), 'Réponse obligatoire']));
    return c;
  }
  function renderEdit() {
    var v = $('editView'); v.innerHTML = '';
    v.appendChild(h('div', { 'class': 'card' }, [
      h('span', { 'class': 'lbl' }, ['Titre du questionnaire']),
      h('input', { type: 'text', 'data-f': 'title', value: tpl.title, 'class': 'stitle' }),
      h('span', { 'class': 'lbl' }, ['Consigne (facultatif)']),
      h('textarea', { 'data-f': 'description', rows: 2, value: tpl.description })
    ]));
    tpl.sections.forEach(function (s, si) {
      var w = h('div', { 'data-s': si });
      w.appendChild(h('div', { 'class': 'card' }, [h('div', { 'class': 'row' }, [
        h('input', { type: 'text', 'class': 'stitle', 'data-f': 'title', placeholder: 'Titre de la section', value: s.title }),
        btn('↑', 'sup', 'Monter la section'), btn('↓', 'sdown', 'Descendre la section'), btn('✕', 'sdel', 'Supprimer la section', true)
      ])]));
      s.questions.forEach(function (q, qi) { w.appendChild(qCard(q, si, qi)); });
      var adds = h('div', { 'class': 'adds' });
      [['+ Question', 'short', 'Texte court'], ['◉ Choix unique (radio)', 'radio', 'Une seule réponse possible'],
       ['☑ QCM (cases)', 'checkbox', 'Plusieurs réponses possibles'], ['⟷ Curseur', 'range', 'Échelle graduée']].forEach(function (a) {
        adds.appendChild(h('button', { type: 'button', 'class': 'mini', 'data-act': 'qadd', 'data-type': a[1], title: a[2] }, [a[0]]));
      });
      w.appendChild(adds);
      v.appendChild(w);
    });
    v.appendChild(h('button', { type: 'button', 'class': 'mini', 'data-act': 'sadd' }, ['+ Section']));
    v.appendChild(h('p', { 'class': 'help' }, ['Utilisez l’onglet « Passation » pour voir le formulaire tel qu’il sera rempli avec le patient.']));
  }

  function onEditInput(e) {
    var t = e.target, f = t.getAttribute && t.getAttribute('data-f');
    if (!f) return;
    dirty = true;
    var qc = t.closest('[data-q]');
    if (qc) {
      var q = tpl.sections[+qc.getAttribute('data-s')].questions[+qc.getAttribute('data-q')];
      if (f === 'type') {
        if (e.type !== 'change' || q.type === t.value) return;
        q.type = t.value;
        if (HAS_OPTS[q.type] && !q.options.length) q.options = ['Option 1', 'Option 2'];
        renderEdit();
      } else if (f === 'options') q.options = t.value.split('\n').map(function (x) { return x.trim(); }).filter(Boolean);
      else if (f === 'required') q.required = t.checked;
      else if (f === 'min' || f === 'max') q[f] = num(t.value, q[f]);
      else if (f === 'step') { var s = num(t.value, q.step); q.step = s > 0 ? s : q.step; }
      else q[f] = t.value;
      return;
    }
    var sc = t.closest('[data-s]');
    if (sc && f === 'title') tpl.sections[+sc.getAttribute('data-s')].title = t.value;
    else if (!sc) tpl[f] = t.value;
  }
  function swap(arr, i, j) { if (j < 0 || j >= arr.length) return false; var x = arr[i]; arr[i] = arr[j]; arr[j] = x; return true; }
  function onEditClick(e) {
    var b = e.target.closest('button[data-act]'); if (!b) return;
    var act = b.getAttribute('data-act');
    var sc = b.closest('[data-s]'), si = sc ? +sc.getAttribute('data-s') : -1;
    var qc = b.closest('[data-q]'), qi = qc ? +qc.getAttribute('data-q') : -1;
    var sec = tpl.sections[si], focus = null;
    dirty = true;
    if (act === 'sadd') { tpl.sections.push(newSection('')); focus = '[data-s="' + (tpl.sections.length - 1) + '"] .stitle'; }
    else if (act === 'sup') swap(tpl.sections, si, si - 1);
    else if (act === 'sdown') swap(tpl.sections, si, si + 1);
    else if (act === 'sdel') {
      if (tpl.sections.length < 2) { alert('Il faut au moins une section.'); return; }
      if (!confirm('Supprimer cette section et ses questions ?')) return;
      tpl.sections.splice(si, 1);
    }
    else if (act === 'qadd') { sec.questions.push(newQuestion(b.getAttribute('data-type') || 'short')); focus = '[data-s="' + si + '"][data-q="' + (sec.questions.length - 1) + '"] input[data-f=label]'; }
    else if (act === 'qup') swap(sec.questions, qi, qi - 1);
    else if (act === 'qdown') swap(sec.questions, qi, qi + 1);
    else if (act === 'qdup') { var c = JSON.parse(JSON.stringify(sec.questions[qi])); c.id = uid(); sec.questions.splice(qi + 1, 0, c); }
    else if (act === 'qdel') { if (!confirm('Supprimer cette question ?')) return; sec.questions.splice(qi, 1); }
    renderEdit();
    if (focus) { var n = document.querySelector('#editView ' + focus); if (n) { n.focus(); n.scrollIntoView({ block: 'center' }); } }
  }

  /* ---------- Mode passation ---------- */
  function control(q) {
    var v = ans[q.id], name = 'r_' + q.id, box = h('div', { 'class': 'ctrl' });
    if (q.type === 'short') box.appendChild(h('input', { type: 'text', value: v || '' }));
    else if (q.type === 'long') box.appendChild(h('textarea', { rows: 3, value: v || '' }));
    else if (q.type === 'number') box.appendChild(h('input', { type: 'number', step: 'any', value: v === undefined ? '' : v }));
    else if (q.type === 'date') box.appendChild(h('input', { type: 'date', value: v || '' }));
    else if (q.type === 'radio') {
      q.options.forEach(function (o) {
        box.appendChild(h('label', { 'class': 'opt' }, [h('input', { type: 'radio', name: name, value: o, checked: v === o }), o]));
      });
      box.appendChild(h('button', { type: 'button', 'class': 'clr', 'data-act': 'clear' }, ['Effacer']));
    } else if (q.type === 'checkbox') {
      q.options.forEach(function (o) {
        box.appendChild(h('label', { 'class': 'opt' }, [h('input', { type: 'checkbox', value: o, checked: Array.isArray(v) && v.indexOf(o) > -1 }), o]));
      });
    } else if (q.type === 'select') {
      var sel = h('select', {}, [h('option', { value: '' }, ['—'])]);
      q.options.forEach(function (o) { sel.appendChild(h('option', { value: o, selected: v === o }, [o])); });
      box.appendChild(sel);
    } else if (q.type === 'range') {
      var set = v !== undefined, mid = (q.min + q.max) / 2;
      box.appendChild(h('div', { 'class': 'rng' + (set ? '' : ' untouched') }, [
        h('span', { 'class': 'e' }, [q.minLabel || String(q.min)]),
        h('input', { type: 'range', min: q.min, max: q.max, step: q.step, value: set ? v : mid }),
        h('span', { 'class': 'e' }, [q.maxLabel || String(q.max)]),
        h('output', {}, [set ? String(v) : '—'])
      ]));
      box.appendChild(h('button', { type: 'button', 'class': 'clr', 'data-act': 'clear' }, ['Effacer']));
    }
    return box;
  }
  function renderFill() {
    var v = $('fillView'); v.innerHTML = '';
    v.appendChild(h('h1', {}, [tpl.title || 'Questionnaire']));
    if (tpl.description) v.appendChild(h('p', { 'class': 'desc' }, [tpl.description]));
    v.appendChild(h('div', { 'class': 'pat' }, [
      h('div', {}, [h('label', {}, ['Identifiant patient']), h('input', { type: 'text', 'data-p': 'id', value: patient.id || '' })]),
      h('div', {}, [h('label', {}, ['Date']), h('input', { type: 'date', 'data-p': 'date', value: patient.date || '' })]),
      h('div', {}, [h('label', {}, ['Examinateur']), h('input', { type: 'text', 'data-p': 'examiner', value: patient.examiner || '' })]),
      h('p', { 'class': 'hint' }, ['Privilégiez un identifiant pseudonymisé plutôt que le nom du patient.'])
    ]));
    tpl.sections.forEach(function (s) {
      if (s.title) v.appendChild(h('h2', {}, [s.title]));
      s.questions.forEach(function (q) {
        var lab = h('div', { 'class': 'ql' }, q.label ? [q.label] : [h('span', { 'class': 'none' }, ['(question sans intitulé)'])]);
        if (q.required) lab.appendChild(h('span', { 'class': 'req' }, ['*']));
        v.appendChild(h('div', { 'class': 'fq', 'data-id': q.id, 'data-type': q.type }, [lab, control(q)]));
      });
    });
    autosizeAll();
  }
  function onFill(e) {
    var t = e.target;
    if (t.hasAttribute && t.hasAttribute('data-p')) { patient[t.getAttribute('data-p')] = t.value; dirty = true; return; }
    var fq = t.closest && t.closest('.fq'); if (!fq) return;
    var id = fq.getAttribute('data-id'), type = fq.getAttribute('data-type');
    dirty = true;
    if (type === 'checkbox') {
      var vals = [].filter.call(fq.querySelectorAll('input[type=checkbox]'), function (c) { return c.checked; }).map(function (c) { return c.value; });
      if (vals.length) ans[id] = vals; else delete ans[id];
    } else if (type === 'radio') { if (t.checked) ans[id] = t.value; }
    else if (type === 'range') {
      ans[id] = parseFloat(t.value);
      fq.querySelector('.rng').classList.remove('untouched');
      fq.querySelector('output').textContent = t.value;
    } else {
      if (t.value === '') delete ans[id]; else ans[id] = t.value;
      if (type === 'long') autosize(t);
    }
  }
  function onFillClick(e) {
    var b = e.target.closest('button[data-act=clear]'); if (!b) return;
    var fq = b.closest('.fq'), id = fq.getAttribute('data-id'), type = fq.getAttribute('data-type');
    delete ans[id]; dirty = true;
    if (type === 'radio') [].forEach.call(fq.querySelectorAll('input[type=radio]'), function (r) { r.checked = false; });
    if (type === 'range') {
      var r = fq.querySelector('input[type=range]');
      r.value = (parseFloat(r.min) + parseFloat(r.max)) / 2;
      fq.querySelector('.rng').classList.add('untouched');
      fq.querySelector('output').textContent = '—';
    }
  }

  /* ---------- Exports ---------- */
  function allQuestions(t) { var l = []; t.sections.forEach(function (s) { s.questions.forEach(function (q) { l.push(q); }); }); return l; }
  function csvCell(v, textual) {
    v = v == null ? '' : String(v);
    if (textual && /^[=+@\t\r]/.test(v)) v = "'" + v;      // évite l'exécution de formules dans Excel
    if (/[;"\n\r]/.test(v)) v = '"' + v.replace(/"/g, '""') + '"';
    return v;
  }
  function toCsv(records, t) {
    var qs = allQuestions(t), used = {};
    var head = ['Identifiant', 'Date', 'Examinateur'].concat(qs.map(function (q, i) {
      var l = q.label || ('Question ' + (i + 1));
      used[l] = (used[l] || 0) + 1;
      return used[l] > 1 ? l + ' (' + used[l] + ')' : l;
    }));
    var lines = [head.map(function (x) { return csvCell(x, true); }).join(';')];
    records.forEach(function (r) {
      var p = r.patient || {}, a = r.answers || {};
      var row = [csvCell(p.id, true), csvCell(p.date), csvCell(p.examiner, true)].concat(qs.map(function (q) {
        var v = a[q.id]; if (Array.isArray(v)) v = v.join(' | ');
        return csvCell(v, q.type !== 'number' && q.type !== 'range');
      }));
      lines.push(row.join(';'));
    });
    return '﻿' + lines.join('\r\n');            // BOM + « ; » : ouverture directe dans Excel FR
  }
  function missing() {
    return allQuestions(tpl).filter(function (q) { return q.required && isEmpty(ans[q.id]); })
      .map(function (q) { return q.label || '(sans intitulé)'; });
  }
  function confirmMissing() {
    var m = missing();
    return !m.length || confirm('Questions obligatoires sans réponse :\n- ' + m.join('\n- ') + '\n\nContinuer quand même ?');
  }
  function baseName() { return slug(tpl.title) + '_' + slug(patient.id || 'patient') + '_' + (patient.date || today()); }

  /* ---------- Chargement ---------- */
  function resetPatient(keepExaminer) { patient = { id: '', date: today(), examiner: keepExaminer ? patient.examiner || '' : '' }; }
  function applyLoaded(o) {
    if (o && o.kind === 'passation') {
      tpl = normalize(o.template);
      ans = (o.answers && typeof o.answers === 'object') ? o.answers : {};
      patient = { id: '', date: today(), examiner: '' };
      var p = o.patient || {}; Object.keys(p).forEach(function (k) { patient[k] = p[k]; });
      setMode('fill');
    } else {
      tpl = normalize((o && o.template) || o); ans = {}; resetPatient(false);
      setMode('edit');
    }
    dirty = false;
  }
  function loadFile(f) {
    var rd = new FileReader();
    rd.onload = function () {
      try {
        var o;
        if (/\.html?$/i.test(f.name)) {
          var d = new DOMParser().parseFromString(rd.result, 'text/html');
          var em = d.getElementById('embedded');
          if (em && em.textContent.trim()) o = { template: JSON.parse(em.textContent) };
          else if (d.querySelector('.sec')) o = { template: fromLegacy(d) };
          else throw new Error('format HTML non reconnu');
          if (o.template && o.template.template) o.template = o.template.template;
        } else o = JSON.parse(rd.result);
        if (dirty && !confirm('Remplacer le contenu actuel ? Les modifications non enregistrées seront perdues.')) return;
        applyLoaded(o);
      } catch (err) { alert('Fichier illisible : ' + err.message); }
    };
    rd.readAsText(f, 'utf-8');
  }
  function mergeFiles(files) {
    Promise.all([].map.call(files, function (f) {
      return new Promise(function (res) {
        var rd = new FileReader();
        rd.onload = function () { try { res(JSON.parse(rd.result)); } catch (e) { res(null); } };
        rd.readAsText(f, 'utf-8');
      });
    })).then(function (list) {
      var ok = list.filter(function (o) { return o && o.kind === 'passation' && o.template; });
      if (!ok.length) { alert('Aucune passation valide dans la sélection.'); return; }
      var t = normalize(ok[0].template), ref = JSON.stringify(allQuestions(t).map(function (q) { return q.id; }));
      var diff = ok.filter(function (o) { return JSON.stringify(allQuestions(normalize(o.template)).map(function (q) { return q.id; })) !== ref; }).length;
      if (diff && !confirm(diff + ' passation(s) utilisent un modèle différent du premier ; leurs colonnes non correspondantes seront vides. Continuer ?')) return;
      download(slug(t.title) + '_fusion.csv', toCsv(ok.map(function (o) { return { patient: o.patient, answers: o.answers }; }), t), 'text/csv');
    });
  }

  /* ---------- Modes ---------- */
  function setMode(m) {
    mode = m;
    document.body.className = 'mode-' + m;
    $('tabEdit').classList.toggle('active', m === 'edit');
    $('tabFill').classList.toggle('active', m === 'fill');
    if (m === 'edit') renderEdit(); else renderFill();
    window.scrollTo(0, 0);
  }

  /* ---------- Branchements ---------- */
  var ev = $('editView');
  ev.addEventListener('input', onEditInput); ev.addEventListener('change', onEditInput); ev.addEventListener('click', onEditClick);
  var fv = $('fillView');
  fv.addEventListener('input', onFill); fv.addEventListener('change', onFill); fv.addEventListener('click', onFillClick);

  $('tabEdit').addEventListener('click', function () { setMode('edit'); });
  $('tabFill').addEventListener('click', function () { setMode('fill'); });
  $('btnLoad').addEventListener('click', function () { $('fileLoad').click(); });
  $('fileLoad').addEventListener('change', function (e) { if (e.target.files[0]) loadFile(e.target.files[0]); e.target.value = ''; });
  $('btnMerge').addEventListener('click', function () { $('fileMerge').click(); });
  $('fileMerge').addEventListener('change', function (e) { if (e.target.files.length) mergeFiles(e.target.files); e.target.value = ''; });

  $('btnNew').addEventListener('click', function () {
    if (!confirm('Créer un nouveau modèle vide ? Les modifications non enregistrées seront perdues.')) return;
    tpl = blankTemplate(); ans = {}; resetPatient(true); dirty = false; setMode('edit');
  });
  $('btnSaveTpl').addEventListener('click', function () {
    download(slug(tpl.title) + '.modele.json', JSON.stringify({ format: FORMAT, version: 1, kind: 'modele', template: tpl }, null, 2), 'application/json');
    dirty = false;
  });
  $('btnSaveHtml').addEventListener('click', function () {
    var clone = document.documentElement.cloneNode(true);
    clone.querySelector('#embedded').textContent = JSON.stringify({ template: tpl }).replace(/</g, '\\u003c');
    clone.querySelector('#editView').innerHTML = ''; clone.querySelector('#fillView').innerHTML = '';
    clone.querySelector('title').textContent = tpl.title || 'Formulaire';
    download(slug(tpl.title) + '.html', '<!DOCTYPE html>\n' + clone.outerHTML, 'text/html');
    dirty = false;
  });
  $('btnSavePass').addEventListener('click', function () {
    if (!confirmMissing()) return;
    download(baseName() + '.passation.json', JSON.stringify({
      format: FORMAT, version: 1, kind: 'passation', template: tpl, patient: patient, answers: ans, savedAt: new Date().toISOString()
    }, null, 2), 'application/json');
    dirty = false;
  });
  $('btnCsv').addEventListener('click', function () {
    if (!confirmMissing()) return;
    download(baseName() + '.csv', toCsv([{ patient: patient, answers: ans }], tpl), 'text/csv');
  });
  $('btnReset').addEventListener('click', function () {
    if (!confirm('Effacer toutes les réponses et l’identifiant patient ?')) return;
    ans = {}; resetPatient(true); renderFill(); dirty = false;
  });
  $('btnPdf').addEventListener('click', function () {
    if (!confirmMissing()) return;
    var old = document.title;
    document.title = baseName();
    autosizeAll(); window.print();
    setTimeout(function () { document.title = old; }, 500);
  });
  window.addEventListener('beforeprint', autosizeAll);
  window.addEventListener('beforeunload', function (e) { if (dirty) { e.preventDefault(); e.returnValue = ''; } });

  /* ---------- Démarrage ---------- */
  resetPatient(false);
  var start = 'edit', emb = $('embedded').textContent.trim();
  if (emb) {
    try { var o = JSON.parse(emb); tpl = normalize(o.template || o); start = 'fill'; } catch (e) { tpl = null; }
  }
  if (!tpl) tpl = blankTemplate();
  setMode(start);
  dirty = false;
})();
</script>
</body>
</html>
